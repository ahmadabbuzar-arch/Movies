<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Reel Room</title>
<style>
:root{--bg:#141414;--panel:#1f1f1f;--elev:#2d2d2d;--ink:#fff;--ink2:#bcbcbc;--mute:#808080;--red:#e50914;--redd:#831010;--line:#8c8c8c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Netflix Sans",Arial,Helvetica,sans-serif}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4vw;background:linear-gradient(#141414,transparent);transition:background .3s}
#top.solid{background:#141414}
.l{display:flex;align-items:center;gap:24px;min-width:0}
h1{margin:0;font:700 1.6rem Arial,sans-serif;letter-spacing:.02em;color:var(--red);text-transform:uppercase}
#menu{display:flex;gap:16px}
#menu button{background:none;border:0;padding:10px 0;font:500 14px/1.3 Arial,sans-serif;letter-spacing:.02em;color:var(--mute);cursor:pointer}
#menu .on,#menu button:hover{color:#fff}
input,select{background:#333;border:1px solid var(--line);border-radius:4px;padding:8px 12px;max-width:100%}
input:focus-visible,select:focus-visible{border-color:#fff;outline:0}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#search{width:min(240px,40vw)}
#hero{position:relative;min-height:min(56vw,80vh);background-size:cover;background-position:center top;display:flex;align-items:flex-end;padding:0 4vw 48px;margin-bottom:-24px}
@media(max-width:600px){#hero{min-height:120vw;padding-bottom:40px}#menu{gap:10px}h1{font-size:1.2rem}}
.hc{max-width:560px}
.hc h2{margin:0 0 12px;font:700 clamp(30px,5vw,52px)/1.1 Arial,sans-serif;letter-spacing:-.01em;text-shadow:0 2px 12px #000a}
.hc p{margin:0 0 20px;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px #000a}
.hb{display:flex;gap:12px}
.play,.info{border:0;border-radius:4px;padding:12px 24px;font:700 16px/1.2 Arial,sans-serif;cursor:pointer;min-height:44px}
.play{background:#fff;color:#141414}.play:hover{background:#ffffffbf}
.info{background:rgba(109,109,110,.7);color:#fff}.info:hover{background:rgba(109,109,110,.45)}
main{position:relative;padding:76px 0 48px}
#hero:not([hidden])+main{padding-top:0}
.rowsec{margin-bottom:12px}
.rowsec h2{margin:0;padding:0 4vw;font:600 clamp(16px,2vw,24px)/1.3 Arial,sans-serif;color:#e5e5e5}
.row{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:14px 4vw 22px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 clamp(120px,44vw,200px);scroll-snap-align:start}
@media(min-width:500px){.row .card{flex-basis:24vw}}
@media(min-width:1100px){.row .card{flex-basis:calc((100vw - 8vw - 40px)/6)}}
@media(min-width:1800px){.row .card{flex-basis:calc((100vw - 8vw - 56px)/8)}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 4vw}
@media(min-width:500px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(min-width:1100px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.card{position:relative;background:none;border:0;padding:0;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .2s;border-radius:4px}
.card:hover{transform:scale(1.05);z-index:3;box-shadow:0 6px 24px rgba(0,0,0,.7)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--panel);border-radius:4px;display:block}
.card span{display:block;padding:6px 2px 0;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{padding:8px 4vw;color:var(--ink2);margin:0}.err{color:#ff6b6b}
.empty{max-width:520px;margin:25vh auto;padding:0 20px;text-align:center}
.overlay{position:fixed;inset:0;background:#000c;display:grid;place-items:start center;overflow:auto;padding:4vh 12px;z-index:20}
.detail{background:#181818;width:min(920px,100%);border-radius:6px;overflow:hidden;position:relative;padding-bottom:20px;box-shadow:0 12px 48px rgba(0,0,0,.8)}
.detail video,.novid,.detail iframe{width:100%;aspect-ratio:16/9;background:#000;display:block}
.novid{display:grid;place-items:center;color:var(--ink2);padding:16px;text-align:center}
.close{position:absolute;top:12px;right:12px;z-index:2;background:#181818;border:0;border-radius:50%;width:36px;height:36px;color:#fff;cursor:pointer;font-size:0}
.close::before{content:"\2715";font-size:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px 0}
.sel{display:grid;gap:2px;font:500 12px Arial,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.sel select{font-size:14px;text-transform:none;letter-spacing:0;color:#fff;min-width:120px}
.alts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 20px 0;align-items:center}
.alts b{font-size:14px}
.alts button{background:var(--elev);border:0;border-radius:4px;padding:8px 16px;cursor:pointer;min-height:36px}
.alts .on{background:#fff;color:#141414}
.detail h3{font:700 24px/1.2 Arial,sans-serif;margin:16px 20px 4px}.detail small{color:var(--ink2);font:400 16px Arial}
.detail p{color:var(--ink2);max-width:70ch;margin:4px 20px 0}
.more{display:block;margin:24px auto 0;background:var(--elev);border:0;border-radius:4px;padding:12px 24px;cursor:pointer;font-weight:700}
.diag{white-space:pre-wrap;word-break:break-all;font:12px/1.4 ui-monospace,monospace;color:var(--ink2);margin:8px 20px 0;padding:8px;border-radius:4px;background:#000}
.overlay{grid-template-columns:minmax(0,1fr);overflow-x:hidden}
.detail{overflow:clip;min-width:0;max-width:100%}
html,body{overflow-x:hidden;max-width:100%}
.pl{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;outline:0}
.detail .pl video{width:100%;height:100%;aspect-ratio:auto;object-fit:contain;display:block}
.pl:fullscreen{aspect-ratio:auto;width:100vw;height:100vh}.pl:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh}
.pl .ctl{position:absolute;left:0;right:0;display:flex;opacity:0;pointer-events:none;transition:opacity .25s;color:#fff}
.pl.show .ctl{opacity:1}.pl.show .bot,.pl.show .mid .pb{pointer-events:auto}
.pl:not(.show){cursor:none}
.pl .top{top:0;padding:12px 56px 36px 16px;background:linear-gradient(#000b,transparent)}
.ttl{font:600 15px/1.2 Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .mid{top:50%;transform:translateY(-50%);justify-content:center;align-items:center;gap:clamp(20px,9vw,72px)}
.pl .bot{bottom:0;flex-direction:column;padding:40px 12px 8px;background:linear-gradient(transparent,#000c)}
.prr{display:flex;align-items:center;gap:12px}
.pr{position:relative;flex:1;height:26px;cursor:pointer;touch-action:none;display:flex;align-items:center}
.pr::before{content:"";position:absolute;left:0;right:0;height:4px;background:#ffffff40;border-radius:2px}
.pr i{position:absolute;left:0;height:4px;border-radius:2px;width:0}
.buf{background:#ffffff66}.pos{background:var(--red)}
.pos::after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--red)}
.tm{font:13px Arial,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.btns{display:flex;align-items:center;gap:2px}.btns .sp{flex:1}
.pb{background:none;border:0;color:#fff;cursor:pointer;display:grid;place-items:center;width:44px;height:44px;padding:0;border-radius:50%;font:700 14px Arial,sans-serif}
.pb svg{width:26px;height:26px;fill:currentColor}
.pb.big{width:68px;height:68px;background:#0008}.pb.big svg{width:38px;height:38px}
.pb.sk svg{width:42px;height:42px}.pb.on{color:var(--red)}
@media(hover:hover){.pb:hover{background:#ffffff26}}
.vol{width:80px;accent-color:#e50914}
.spin{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.pl.wait .spin{display:grid}.pl.wait .big{visibility:hidden}
.spin::after{content:"";width:46px;height:46px;border:4px solid #ffffff40;border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000a;padding:8px 16px;border-radius:20px;font:700 14px Arial,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s}.flash.on{opacity:1}
.moresec{margin:22px 20px 0}.moresec h4{font:700 18px Arial,sans-serif;margin:0 0 10px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}@media(min-width:700px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}.mgrid .card{min-width:0}.mgrid img{max-width:100%}
#sent{height:1px}
.menu{position:absolute;right:12px;bottom:64px;width:min(240px,calc(100% - 24px));max-height:calc(100% - 90px);overflow:auto;background:#181818f2;border-radius:8px;padding:6px 0;box-shadow:0 8px 30px #000a;z-index:6;backdrop-filter:blur(8px)}
.mh{font:700 11px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:10px 16px 4px}
.mi{display:flex;gap:10px;align-items:center;width:100%;min-height:42px;background:none;border:0;color:#fff;text-align:left;padding:8px 16px;font:15px Arial,sans-serif;cursor:pointer}
.mi.on{font-weight:700}.ck{width:16px;color:var(--red)}
@media(hover:hover){.mi:hover{background:#ffffff1f}}
@media(max-width:700px){
 #top{padding:max(10px,env(safe-area-inset-top)) 14px 10px;gap:8px}.l{gap:12px}#search{width:34vw}input,select{font-size:16px}
 .hc p{-webkit-line-clamp:2}.hb button{flex:1}
 .overlay{padding:0;place-items:stretch}.detail{width:100%;border-radius:0;min-height:100%}
 .vbox{position:sticky;top:0;z-index:5;background:#000}
 .close{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:30}
 .bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.sel select{width:100%;min-width:0}
 .vol{display:none}.pb.big{width:56px;height:56px}
}
@media(prefers-reduced-motion:reduce){.spin::after{animation:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}

/* ===== premium layer ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
::selection{background:var(--red);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
body{background:radial-gradient(1200px 600px at 85% -10%,#2a0a0d66,transparent 60%),#141414}
#top{backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);background:linear-gradient(#000c,#0000)}
#top.solid{background:rgba(20,20,20,.9);box-shadow:0 1px 0 #ffffff14}
h1{letter-spacing:.08em;text-shadow:0 0 26px #e5091477}
#menu button{position:relative;transition:color .2s}
#menu .on::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:2px;border-radius:2px;background:var(--red)}
#search{border-radius:999px;background:#ffffff14;border-color:#ffffff26;padding:8px 16px;transition:width .3s var(--ease),background .2s}
#search:focus{width:min(320px,56vw);background:#000a;border-color:#fff}
#hero{animation:fade .8s var(--ease) both}
#hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 15% 100%,#141414cc,transparent 70%);pointer-events:none}
.hc{position:relative;z-index:1}
.hc h2{font-size:clamp(34px,6vw,64px);letter-spacing:-.02em;font-weight:800}
.hm{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{font:600 12px Arial,sans-serif;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:#ffffff22;backdrop-filter:blur(6px)}
.chip.star{color:#f5c518}
.play,.info{border-radius:6px;transition:transform .15s var(--ease),background .2s,box-shadow .2s}
.play{box-shadow:0 8px 24px #0008}.play:hover{transform:translateY(-1px)}
.play:active,.info:active,.card:active{transform:scale(.97)}
.rowsec{animation:up .6s var(--ease) both}
.rowsec h2{display:flex;align-items:center;gap:10px}
.rowsec h2::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--red)}
.row{-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.ph{position:relative;border-radius:8px;overflow:hidden;background:#1f1f1f;box-shadow:0 4px 14px #0007;transition:box-shadow .25s}
.card img{border-radius:0}
.ph::after{content:"\25B6";position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:#fff;background:linear-gradient(transparent 40%,#000b);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover .ph::after,.card:focus-visible .ph::after{opacity:1}
.card:hover .ph{box-shadow:0 12px 30px #000c,0 0 0 2px #ffffff40}
.rt{position:absolute;top:6px;left:6px;z-index:1;font:700 11px Arial,sans-serif;padding:3px 7px;border-radius:999px;background:#000a;backdrop-filter:blur(6px);color:#f5c518}
.moresec .card img,.mgrid img{border-radius:8px}
.skel{padding:80px 4vw 0}.skrow{display:flex;gap:8px;margin-bottom:24px;overflow:hidden}
.skrow i{flex:0 0 clamp(120px,44vw,200px);aspect-ratio:2/3;border-radius:8px;background:linear-gradient(100deg,#1f1f1f 40%,#2b2b2b 50%,#1f1f1f 60%) 0 0/200% 100%;animation:shine 1.2s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}}
.overlay{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .25s both}
.detail{border-radius:14px;animation:pop .35s var(--ease) both;box-shadow:0 30px 80px #000d,0 0 0 1px #ffffff14}
.detail h3{font-size:clamp(22px,4vw,30px);letter-spacing:-.01em}
.close{background:#181818cc;backdrop-filter:blur(8px);transition:transform .2s,background .2s}
@media(hover:hover){.close:hover{transform:scale(1.08);background:#333}}
.pb.big{backdrop-filter:blur(8px);background:#0009;border:1px solid #ffffff33}
.pos{box-shadow:0 0 10px #e5091488}
.menu{backdrop-filter:blur(14px);border:1px solid #ffffff14}
.mi{border-radius:6px;margin:0 6px;width:calc(100% - 12px)}
.more{border-radius:6px;transition:background .2s}
@media(max-width:700px){.detail{border-radius:0;animation:fade .25s both}.hc h2{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== premium detail background ===== */
.detail{background:linear-gradient(180deg,#0c0c0f,#050506 70%);isolation:isolate}
.detail::before{content:"";position:absolute;inset:0 0 auto 0;height:900px;z-index:-1;background:var(--bgi) center top/cover no-repeat;filter:blur(50px) saturate(1.5);transform:scale(1.3);opacity:.3;pointer-events:none;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
.detail::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(800px 380px at 50% 0,#e5091424,transparent 70%);pointer-events:none}
.detail p{color:#d0d0d0}
.alts button{background:#ffffff14;border:1px solid #ffffff1f;backdrop-filter:blur(6px)}
.moresec h4{display:flex;align-items:center;gap:10px}
.moresec h4::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--red)}
.mgrid .card span{color:#bdbdbd}.msent{height:1px}

/* ===== mobile header ===== */
h1{white-space:nowrap}
@media(max-width:700px){
 #top{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"logo search" "menu menu";align-items:center;gap:2px 12px;padding:max(10px,env(safe-area-inset-top)) 14px 6px}
 .l{display:contents}
 h1{grid-area:logo;font-size:1.15rem}
 #search{grid-area:search;width:100%;min-width:0}#search:focus{width:100%}
 #menu{grid-area:menu;gap:20px}
 main{padding-top:112px}.skel{padding-top:112px}
}

/* phones: drop blur layers that cause scroll glitches */
.pb{-webkit-tap-highlight-color:transparent}
@media(max-width:700px),(pointer:coarse){
 .overlay{backdrop-filter:none;-webkit-backdrop-filter:none;background:#000e}
 .detail::before{display:none}.detail{animation:none}
 .close,.pb.big,.menu,.chip,.alts button,.rt{backdrop-filter:none;-webkit-backdrop-filter:none}
 .close{background:#181818}.pb.big{background:#000a}.menu{background:#181818}.alts button{background:#262626}
}

/* search results use the same look as the rows */
.qt{display:flex;align-items:center;gap:10px;margin:0;padding:0 4vw 12px;font:600 clamp(16px,2vw,24px)/1.3 Arial,sans-serif;color:#e5e5e5}
.qt::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--red)}
.grid{gap:14px 10px}
.grid .card{animation:up .4s var(--ease) both}

/* cards must never be wider than their grid cell */
.card{min-width:0;max-width:100%}.ph{width:100%}.card img{max-width:100%}
</style>

<header id="top">
  <div class="l"><h1>Reel Room</h1>
    <nav id="menu"><button data-v="all" class="on">Home</button><button data-v="movie">Movies</button><button data-v="series">Series</button></nav></div>
  <input id="search" type="search" placeholder="Titles, people, genres" aria-label="Search" hidden>
</header>
<section id="hero" hidden></section>
<main>
  <nav id="nav" hidden></nav>
  <p id="note" class="note"></p>

  <h2 id="qtitle" class="qt" hidden></h2>
  <div class="grid" id="grid" hidden></div>

</main>

  <h2>No sources available</h2>

<!-- Built-in demo provider: public-domain films from the Internet Archive (no API key) -->
<script type="text/plain" id="demo-provider">
const API = "https://archive.org";
const img = (id) => `${API}/services/img/${id}`;
const toPost = (d) => ({ title: d.title, link: d.identifier, image: img(d.identifier) });

async function list(q, page, ctx) {
  const url = `${API}/advancedsearch.php?q=${encodeURIComponent(q)}` +
    `&fl[]=identifier&fl[]=title&sort[]=downloads+desc&rows=24&page=${page}&output=json`;
  const r = await ctx.fetch(url);
  if (!r.ok) throw new Error(`Archive.org ${r.status}`);
  return (await r.json()).response.docs.map(toPost);
}

export default {
  id: "archive-demo",
  name: "Internet Archive (public domain)",
  async getCatalog() {
    return [
      { title: "Popular films", filter: "collection:feature_films" },
      { title: "Sci-Fi & Horror", filter: "collection:SciFi_Horror" },
      { title: "Film Noir", filter: "collection:film_noir" },
      { title: "Comedy", filter: "collection:comedy_films" },
    ];
  },
  getPosts: ({ filter, page }, ctx) =>
    list(`${filter || "collection:feature_films"} AND mediatype:movies`, page, ctx),
  getSearchPosts: ({ query, page }, ctx) =>
    list(`title:(${query}) AND collection:feature_films AND mediatype:movies`, page, ctx),
  async getMeta({ link }, ctx) {
    const m = await (await ctx.fetch(`${API}/metadata/${link}`)).json();
    const md = m.metadata || {};
    const text = (v) => (Array.isArray(v) ? v[0] : v) || "";
    return {
      title: text(md.title), image: img(link),
      synopsis: text(md.description).replace(/<[^>]+>/g, ""),
      year: text(md.year || md.date).slice(0, 4), type: "movie",
    };
  },
  async getStream({ link }, ctx) {
    const m = await (await ctx.fetch(`${API}/metadata/${link}`)).json();
    return (m.files || [])
      .filter((f) => /\.mp4$/i.test(f.name))
      .sort((a, b) => (+b.size || 0) - (+a.size || 0))
      .slice(0, 3)
      .map((f) => ({ server: "archive.org", link: `${API}/download/${link}/${encodeURIComponent(f.name)}`, type: "mp4", quality: f.name }));
  },
};
</script>

<script>
"use strict";
/* ===================== small helpers ===================== */
const $ = (s) => document.querySelector(s);
const enc = encodeURIComponent;
const store = {
  get: (k, d = "") => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
};
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");

/* ===================== storage (IndexedDB) ===================== */
const idb = (() => {
  let dbp;
  const open = () => (dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open("reelroom", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("providers", { keyPath: "id" });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("providers", mode);
      const rq = fn(t.objectStore("providers"));
      t.oncomplete = () => res(rq?.result);
      t.onerror = () => rej(t.error);
    });
  };
  return { all: () => tx("readonly", (s) => s.getAll()), put: (r) => tx("readwrite", (s) => s.put(r)), del: (id) => tx("readwrite", (s) => s.delete(id)) };
})();

    if (meta?.linkList?.length) {
      if (eps) nodes.push(el("div", { class: "alts" }, el("b", {}, eps.title || "Episodes"),
        eps.list === null && el("span", { class: "note" }, "Loading episodes…"),
        eps.list && eps.list.length === 0 && el("span", { class: "note" }, "No episodes found."),
        (eps.list || []).map((e, k) => el("button", { onclick: () => play(e.link, "series") }, e.title || `Episode ${k + 1}`))));
      for (const g of meta.linkList) {
        if (meta.linkList.length === 1 && !g.episodesLink && (g.directLinks || []).length === 1) continue; // single movie link: already autoplays
        nodes.push(el("div", { class: "alts" },
          el("b", {}, g.title || g.quality || "Links"),
          (g.directLinks || []).map((d, k) => el("button", { onclick: () => play(d.link, d.type || meta.type) }, d.title || `Play ${k + 1}`)),
          g.episodesLink && el("button", { class: sel === g ? "on" : "", onclick: () => showEpisodes(g) }, "Episodes")));
      }
    }
    nodes.push(el("h3", {}, meta?.title || post.title, meta?.year && el("small", {}, ` ${meta.year}`)));
    nodes.push(el("p", {}, meta?.synopsis || (meta ? "No synopsis available." : "")));
    nodes.push(moreSec);
    body.replaceChildren(...nodes);
  }

  draw();
  const loadMore = async () => {
    if (moreBusy || moreDone || gone || !p.getMore) return;
    moreBusy = true;
    try {
      const l = await withTimeout(Promise.resolve(p.getMore({ link: post.link, page: morePage })), 20000);
      if (gone) return;
      morePage++; if (!l?.length || morePage > 12) moreDone = true;
      const have = new Set((more || []).map((x) => x.link)), fresh = (l || []).filter((x) => !have.has(x.link) && x.link !== post.link);
      more = (more || []).concat(fresh);
      for (const x of fresh) mgrid.append(mcard(x));
      if (fresh.length) moreSec.hidden = false;
      if (!mobs) { mobs = new IntersectionObserver((e) => { if (e[0].isIntersecting) loadMore(); }, { rootMargin: "600px" }); mobs.observe(msent); }
      moreBusy = false;
      if (!moreDone && (fresh.length < 6 || msent.getBoundingClientRect().top < innerHeight + 800)) loadMore();
    } catch { moreDone = true; }
    moreBusy = false;
  };
  loadMore();
  withTimeout(p.getMeta({ link: post.link })).then((m) => {
    if (gone) return;
    meta = m || {};
    if (meta.linkList?.length) {
      const g = meta.linkList.find((x) => x.directLinks?.length);
      if (g) play(g.directLinks[0].link, g.directLinks[0].type || meta.type);
      else {
        // series: nothing to play yet -> prompt and open the first language's episodes
        idle = true; draw();
        const first = meta.linkList.find((x) => x.episodesLink);
        if (first) showEpisodes(first);
      }
    } else play(post.link);
  }).catch((e) => { if (gone) return; meta = {}; err = e.message; play(post.link); });
}

/* ===================== provider manager ===================== */
function openManager() {
  const host = $("#modal");
  const close = () => { host.replaceChildren(); window.removeEventListener("keydown", esc); };
  const esc = (e) => e.key === "Escape" && close();
  window.addEventListener("keydown", esc);
  let file = null, busy = false, msg = null;

  const draw = () => {
    const list = S.providers.length
      ? el("ul", { class: "plist" }, S.providers.map((p) => el("li", {},
          el("div", { class: "row" }, el("span", {}, p.name),
            el("button", { disabled: busy, onclick: () => removeProvider(p) }, "Remove")),
          el("input", { type: "url", placeholder: "Base URL (optional, for providers that need it)", value: p.rec.baseUrl || "",
            onchange: async (e) => { p.rec.baseUrl = e.target.value.trim(); try { await idb.put(p.rec); } catch { /* memory only */ } } }),
          el("input", { type: "text", placeholder: 'Stream headers JSON (optional) e.g. {"Referer":"https://site.com/"}',
            value: p.rec.streamHeaders ? JSON.stringify(p.rec.streamHeaders) : "",
            onchange: async (e) => {
              try { p.rec.streamHeaders = e.target.value.trim() ? JSON.parse(e.target.value) : undefined; e.target.style.outline = ""; }
              catch { e.target.style.outline = "2px solid #ff9b8a"; return; }
              try { await idb.put(p.rec); } catch { /* memory only */ }
            } }))))
      : el("p", { class: "note" }, "No providers installed.");
    const failed = S.failed.map((f) => el("p", { class: "note err" }, `${f.id}: ${f.error}`));
    const fileIn = el("input", { type: "file", accept: ".zip,.js,.cjs,.mjs,application/zip,text/javascript", onchange: (e) => { file = e.target.files[0] || null; draw(); } });
    const proxyIn = el("input", { type: "text", value: store.get("proxyUrl"), placeholder: "/api/proxy (default, same site)",
      onchange: (e) => store.set("proxyUrl", e.target.value.trim()) });
    const sec = el("section", { class: "detail manage", onclick: (e) => e.stopPropagation() },
      el("button", { class: "close", onclick: close, "aria-label": "Close" }, "Close"),
      el("h2", {}, "Providers"), list, failed,
      el("h3", {}, "Upload provider zip"),
      el("p", { class: "note" }, "Native (index.js / main.js), Nuvio-style (getStreams), Vega-style (posts.js, meta.js, stream.js…) and single .js providers. A zip with many providers installs them all. Provider code runs in your browser, so only upload zips you trust."),
      fileIn,
      el("button", { class: "primary", disabled: busy || !file, onclick: upload }, busy ? "Working…" : "Upload & install"),
      el("h3", {}, "Proxy URL"),
      el("p", { class: "note" }, "Used for sites that block browsers (CORS) and for streams that need headers. Leave empty to use this site's /api/proxy."),
      proxyIn,
      msg && el("p", { class: msg.ok ? "note ok" : "note err", role: "status" }, msg.text));
    host.replaceChildren(el("div", { class: "overlay", onclick: close }, sec));
  };

  async function upload() {
    busy = true; msg = null; draw();
    try {
      let files;
      if (/\.(c|m)?js$/i.test(file.name)) files = new Map([["index.js", await file.text()]]);
      else {
        files = await readZip(await file.arrayBuffer());
        if (!files.size) throw new Error("Zip has no .js files");
      }
      const found = findProviders(files);
      if (!found.length) throw new Error("No provider found (need index.js/main.js, posts.js + stream.js, or any js exporting getPosts + getStream, or Nuvio-style getStreams)");
      const base = file.name.replace(/\.zip$/i, "");
      const added = [], failed = [];
      for (const f of found) {
        const folder = f.entry ? f.entry.replace(/\.(c|m)?js$/i, "") : f.dir ? f.dir.split("/").pop() : base;
        try {
          const rec = { id: folder, folder, files: f.files, baseUrl: "", entry: f.entry };
          const prov = await loadProvider(rec);
          rec.id = prov.id;
          const old = S.providers.find((x) => x.id === prov.id);
          if (old) { rec.baseUrl = old.rec.baseUrl || ""; rec.streamHeaders = old.rec.streamHeaders; }
          try { await idb.put(rec); } catch { /* memory only */ }
          S.providers = S.providers.filter((x) => x.id !== prov.id).concat(prov);
          S.failed = S.failed.filter((x) => x.id !== prov.id);
          added.push(prov);
        } catch (e) { failed.push(`${folder}: ${e.message}`); }
      }
      if (!added.length) throw new Error(failed.join(" | "));
      msg = { ok: true, text: `Added ${added.map((a) => `“${a.name}”`).join(", ")}.${failed.length ? " Skipped: " + failed.join(" | ") : ""}` };
      file = null;
      await selectProvider(autoProv() ? AUTO : added[0].id);
    } catch (e) { msg = { ok: false, text: e.message }; }
    busy = false; draw();
  }

  async function removeProvider(p) {
    if (!confirm(`Remove provider “${p.name}”?`)) return;
    try { await idb.del(p.id); } catch { /* ignore */ }
    S.providers = S.providers.filter((x) => x.id !== p.id);
    msg = { ok: true, text: `Removed “${p.name}”.` };
    if (S.pid === p.id || (S.pid === AUTO && !autoProv())) await selectProvider(S.providers[0]?.id || ""); else renderShell();
    draw();
  }
  draw();
}

/* ===================== boot ===================== */
$("#more").addEventListener("click", () => fetchPosts(false));
const rowsData = []; let view = "all";
const card = (p) => el("button", { class: "card", onclick: () => openDetail(p) },
  el("div", { class: "ph" }, el("img", { src: p.image || "", alt: "", loading: "lazy", referrerpolicy: "no-referrer" }), p.rating ? el("b", { class: "rt" }, "\u2605 " + p.rating) : null),
  el("span", {}, p.title));
const applyView = () => rowsData.forEach(({ row }) => { row.hidden = view !== "all" && row.dataset.k !== view; });
async function renderHome() {
  const p = cur();
  if (!p) return renderShell();
  $("#home").replaceChildren(el("div", { class: "skel" }, ...[0, 1].map(() => el("div", { class: "skrow" }, ...Array.from({ length: 8 }, () => el("i")))))); rowsData.length = 0; setNote("");
  const cats = (await withTimeout(p.getCatalog()).catch(() => [])) || [];
  const res = await Promise.allSettled(cats.map((c) => withTimeout(p.getPosts({ filter: c.filter, page: 1 }))));
  $("#home").replaceChildren();
  cats.forEach((c, i) => {
    const items = res[i].status === "fulfilled" ? res[i].value : [];
    if (!items.length) return;
    const row = el("section", { class: "rowsec", "data-k": String(c.filter).split("/")[0] }, el("h2", {}, c.title), el("div", { class: "row" }, items.map(card)));
    rowsData.push({ row, items }); $("#home").append(row);
  });
  setNote(rowsData.length ? "" : "No titles found.");
  applyView(); heroFrom(rowsData[0]?.items); setTimeout(moreRows, 0);
}
const GENRES = ["Action", "Comedy", "Drama", "Thriller", "Sci-Fi", "Horror", "Animation", "Adventure", "Crime", "Romance", "Fantasy", "Mystery", "Family", "Documentary", "History", "War", "Biography", "Sport", "Western"];
const planAt = (i) => {
  const G = GENRES.length, page = Math.floor(i / (2 * G)) + 1, j = i % (2 * G), g = GENRES[Math.floor(j / 2)], type = j % 2 ? "series" : "movie";
  return { type, page, filter: `${type}/top/genre=${g}`, title: `${g} ${type === "movie" ? "Movies" : "Series"}${page > 1 ? ` \u00B7 Part ${page}` : ""}` };
};
const cursor = { all: 0, movie: 0, series: 0 }, seenRows = new Set(); let loadingRows = false;
const nearEnd = () => $("#sent").getBoundingClientRect().top < innerHeight + 700;
async function moreRows() { // endless scroll: genre rows, then the same genres page after page
  const p = cur();
  if (loadingRows || S.query || !p || !S.providers.some((x) => x.tmdb) || !rowsData.length) return;
  loadingRows = true;
  try {
    for (let added = 0, tries = 0; added < 2 && tries < 8; tries++) {
      const i = cursor[view]++, plan = planAt(view === "all" ? i : i * 2 + (view === "series" ? 1 : 0)), key = plan.filter + "|" + plan.page;
      if (seenRows.has(key)) continue;
      seenRows.add(key);
      const items = await withTimeout(p.getPosts({ filter: plan.filter, page: plan.page })).catch(() => []);
      if (!items.length) continue;
      const row = el("section", { class: "rowsec", "data-k": plan.type }, el("h2", {}, plan.title), el("div", { class: "row" }, items.map(card)));
      rowsData.push({ row, items }); $("#home").append(row); applyView(); added++;
    }
  } finally { loadingRows = false; }
  if (nearEnd()) moreRows();
}
new IntersectionObserver((e) => { if (e[0].isIntersecting) moreRows(); }, { rootMargin: "700px" }).observe($("#sent"));
async function heroFrom(items) {
  const h = $("#hero");
  if (!items?.length) { h.hidden = true; return; }
  const pick = items.find((x) => x.image) || items[0]; let m = {};
  try { m = await withTimeout(cur().getMeta({ link: pick.link }), 15000); } catch { /* poster fallback */ }
  const img = (m.background || m.image || pick.image || "").replace(/"/g, "%22");
  h.hidden = false;
  h.style.backgroundImage = `linear-gradient(to top,#141414,transparent 55%),linear-gradient(to right,rgba(0,0,0,.65),transparent 60%),url("${img}")`;
  const open = () => openDetail(pick);
  h.replaceChildren(el("div", { class: "hc" }, el("div", { class: "hm" }, m.year || pick.year ? el("span", { class: "chip" }, m.year || pick.year) : null, el("span", { class: "chip" }, m.type === "series" ? "Series" : "Movie"), pick.rating ? el("span", { class: "chip star" }, "\u2605 " + pick.rating) : null),
    el("h2", {}, m.title || pick.title), el("p", {}, m.synopsis || ""),
    el("div", { class: "hb" }, el("button", { class: "play", onclick: open }, "\u25B6 Play"), el("button", { class: "info", onclick: open }, "\u24D8 More Info"))));
}
function doSearch(q) {
  S.query = q;
  $("#qtitle").textContent = q ? `Results for \u201C${q}\u201D` : ""; $("#qtitle").hidden = !q;
  $("#home").hidden = !!q; $("#hero").style.display = q ? "none" : ""; $("#grid").hidden = !q;
  if (q) fetchPosts(true); else { S.posts = []; renderGrid(false); $("#more").hidden = true; setNote(""); }
}
$("#search").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(e.target.value.trim()); });
$("#search").addEventListener("input", (e) => { if (!e.target.value && S.query) doSearch(""); });
$("#menu").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v; $("#search").value = ""; if (S.query) doSearch("");
  [...$("#menu").children].forEach((x) => x.classList.toggle("on", x === b)); applyView();
  $("#hero").style.display = view === "all" && !S.query ? "" : "none"; scrollTo(0, 0); moreRows();
});
addEventListener("scroll", () => $("#top").classList.toggle("solid", scrollY > 20), { passive: true });

// Providers ship with the site: every file in /providers is loaded automatically.
async function loadRepoProviders() {
  let names = [];
  try { names = (await (await fetch("/api/providers")).json()).files || []; } catch { /* fall back */ }
  if (!names.length) try { names = await (await fetch("providers/index.json")).json(); } catch { /* none */ }
  const files = new Map();
  const queue = [...names]; // fetch 8 files at a time; only .js/.json are needed, other file types are ignored
  await Promise.all(Array.from({ length: 8 }, async () => {
    for (let n; (n = queue.shift()); ) {
      try {
        const r = await fetch("providers/" + n.split("/").map(encodeURIComponent).join("/")); if (!r.ok) continue;
        if (/\.zip$/i.test(n)) (await readZip(await r.arrayBuffer())).forEach((v, k) => files.set(`providers/${n.replace(/\.zip$/i, "")}/${k}`, v)); // zips work without unzipping
        else files.set("providers/" + n, await r.text());
      } catch (e) { S.failed.push({ id: n, error: e.message }); }
    }
  }));
  for (const f of findProviders(files)) {
    const folder = f.entry ? f.entry.replace(/\.(c|m)?js$/i, "") : f.dir.split("/").pop() || "provider";
    try { S.providers.push(await loadProvider({ id: folder, folder, files: f.files, baseUrl: "", entry: f.entry })); }
    catch (e) { S.failed.push({ id: folder, error: e.message }); console.warn(`[skip] ${folder}: ${e.message}`); }
  }
  S.report = `files read: ${files.size}\nlisted: ${names.length}\nloaded (${S.providers.length}):\n` + S.providers.map((x) => `  ${x.name} [${x.tmdb ? "tmdb" : "search"}]`).join("\n") + `\nskipped (${S.failed.length}):\n` + S.failed.map((x) => `  ${x.id}: ${x.error}`).join("\n");
}
(async () => {
  setNote("Loading…");
  await loadRepoProviders();
  setNote("");
  if (location.hash === "#debug") $("#modal").replaceChildren(el("div", { class: "overlay", onclick: (e) => e.target.classList.contains("overlay") && e.target.remove() }, el("pre", { class: "diag" }, S.report || "")));
  S.pid = AUTO; renderShell(); await renderHome();
})();
</script>
