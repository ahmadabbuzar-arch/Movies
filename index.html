<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reel Room</title>
<style>
:root{--bg:#141414;--panel:#1f1f1f;--elev:#2d2d2d;--ink:#fff;--ink2:#bcbcbc;--mute:#808080;--red:#e50914;--redd:#831010;--line:#8c8c8c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Netflix Sans",Arial,Helvetica,sans-serif}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4vw;background:linear-gradient(#141414,transparent);transition:background .3s}
#top.solid{background:#141414}
.l{display:flex;align-items:center;gap:24px;min-width:0}
h1{margin:0;font:700 1.6rem Arial,sans-serif;letter-spacing:.02em;color:var(--red);text-transform:uppercase}
#menu{display:flex;gap:16px}
#menu button{background:none;border:0;padding:10px 0;font:500 14px/1.3 Arial,sans-serif;letter-spacing:.02em;color:var(--mute);cursor:pointer}
#menu .on,#menu button:hover{color:#fff}
input,select{background:#333;border:1px solid var(--line);border-radius:4px;padding:8px 12px;max-width:100%}
input:focus-visible,select:focus-visible{border-color:#fff;outline:0}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#search{width:min(240px,40vw)}
#hero{position:relative;min-height:min(56vw,80vh);background-size:cover;background-position:center top;display:flex;align-items:flex-end;padding:0 4vw 48px;margin-bottom:-24px}
@media(max-width:600px){#hero{min-height:120vw;padding-bottom:40px}#menu{gap:10px}h1{font-size:1.2rem}}
.hc{max-width:560px}
.hc h2{margin:0 0 12px;font:700 clamp(30px,5vw,52px)/1.1 Arial,sans-serif;letter-spacing:-.01em;text-shadow:0 2px 12px #000a}
.hc p{margin:0 0 20px;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px #000a}
.hb{display:flex;gap:12px}
.play,.info{border:0;border-radius:4px;padding:12px 24px;font:700 16px/1.2 Arial,sans-serif;cursor:pointer;min-height:44px}
.play{background:#fff;color:#141414}.play:hover{background:#ffffffbf}
.info{background:rgba(109,109,110,.7);color:#fff}.info:hover{background:rgba(109,109,110,.45)}
main{position:relative;padding:76px 0 48px}
#hero:not([hidden])+main{padding-top:0}
.rowsec{margin-bottom:12px}
.rowsec h2{margin:0;padding:0 4vw;font:600 clamp(16px,2vw,24px)/1.3 Arial,sans-serif;color:#e5e5e5}
.row{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:14px 4vw 22px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 clamp(120px,44vw,200px);scroll-snap-align:start}
@media(min-width:500px){.row .card{flex-basis:24vw}}
@media(min-width:1100px){.row .card{flex-basis:calc((100vw - 8vw - 40px)/6)}}
@media(min-width:1800px){.row .card{flex-basis:calc((100vw - 8vw - 56px)/8)}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 4vw}
@media(min-width:500px){.grid{grid-template-columns:repeat(4,1fr)}}@media(min-width:1100px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{position:relative;background:none;border:0;padding:0;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .2s;border-radius:4px}
.card:hover{transform:scale(1.05);z-index:3;box-shadow:0 6px 24px rgba(0,0,0,.7)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--panel);border-radius:4px;display:block}
.card span{display:block;padding:6px 2px 0;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{padding:8px 4vw;color:var(--ink2);margin:0}.err{color:#ff6b6b}
.empty{max-width:520px;margin:25vh auto;padding:0 20px;text-align:center}
.overlay{position:fixed;inset:0;background:#000c;display:grid;place-items:start center;overflow:auto;padding:4vh 12px;z-index:20}
.detail{background:#181818;width:min(920px,100%);border-radius:6px;overflow:hidden;position:relative;padding-bottom:20px;box-shadow:0 12px 48px rgba(0,0,0,.8)}
.detail video,.novid,.detail iframe{width:100%;aspect-ratio:16/9;background:#000;display:block}
.novid{display:grid;place-items:center;color:var(--ink2);padding:16px;text-align:center}
.close{position:absolute;top:12px;right:12px;z-index:2;background:#181818;border:0;border-radius:50%;width:36px;height:36px;color:#fff;cursor:pointer;font-size:0}
.close::before{content:"\2715";font-size:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px 0}
.sel{display:grid;gap:2px;font:500 12px Arial,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}

.detail h3{font:700 24px/1.2 Arial,sans-serif;margin:16px 20px 4px}.detail small{color:var(--ink2);font:400 16px Arial}
.detail p{color:var(--ink2);max-width:70ch;margin:4px 20px 0}
.more{display:block;margin:24px auto 0;background:var(--elev);border:0;border-radius:4px;padding:12px 24px;cursor:pointer;font-weight:700}
.diag{white-space:pre-wrap;word-break:break-all;font:12px/1.4 ui-monospace,monospace;color:var(--ink2);margin:8px 20px 0;padding:8px;border-radius:4px;background:#000}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}

<header id="top">
  <div class="l"><h1>Reel Room</h1>
    <nav id="menu"><button data-v="all" class="on">Home</button><button data-v="movie">Movies</button><button data-v="series">Series</button></nav></div>

<!-- Built-in demo provider: public-domain films from the Internet Archive (no API key) -->
<script type="text/plain" id="demo-provider">
const API = "https://archive.org";
const img = (id) => `${API}/services/img/${id}`;
const toPost = (d) => ({ title: d.title, link: d.identifier, image: img(d.identifier) });

async function list(q, page, ctx) {
  const url = `${API}/advancedsearch.php?q=${encodeURIComponent(q)}` +
    `&fl[]=identifier&fl[]=title&sort[]=downloads+desc&rows=24&page=${page}&output=json`;
  const r = await ctx.fetch(url);
  if (!r.ok) throw new Error(`Archive.org ${r.status}`);
  return (await r.json()).response.docs.map(toPost);
}

export default {
  id: "archive-demo",
  name: "Internet Archive (public domain)",
  async getCatalog() {
    return [
      { title: "Popular films", filter: "collection:feature_films" },
      { title: "Sci-Fi & Horror", filter: "collection:SciFi_Horror" },
      { title: "Film Noir", filter: "collection:film_noir" },
      { title: "Comedy", filter: "collection:comedy_films" },
    ];
  },
  getPosts: ({ filter, page }, ctx) =>
    list(`${filter || "collection:feature_films"} AND mediatype:movies`, page, ctx),
  getSearchPosts: ({ query, page }, ctx) =>
    list(`title:(${query}) AND collection:feature_films AND mediatype:movies`, page, ctx),
  async getMeta({ link }, ctx) {
    const m = await (await ctx.fetch(`${API}/metadata/${link}`)).json();
    const md = m.metadata || {};
    const text = (v) => (Array.isArray(v) ? v[0] : v) || "";
    return {
      title: text(md.title), image: img(link),
      synopsis: text(md.description).replace(/<[^>]+>/g, ""),
      year: text(md.year || md.date).slice(0, 4), type: "movie",
    };
  },
  async getStream({ link }, ctx) {
    const m = await (await ctx.fetch(`${API}/metadata/${link}`)).json();
    return (m.files || [])
      .filter((f) => /\.mp4$/i.test(f.name))
      .sort((a, b) => (+b.size || 0) - (+a.size || 0))
      .slice(0, 3)
      .map((f) => ({ server: "archive.org", link: `${API}/download/${link}/${encodeURIComponent(f.name)}`, type: "mp4", quality: f.name }));
  },
};
</script>

<script>
"use strict";
/* ===================== small helpers ===================== */
const $ = (s) => document.querySelector(s);
const enc = encodeURIComponent;
const store = {
  get: (k, d = "") => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
};
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
const withTimeout = (p, ms = 30000) =>
  Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("Provider timeout")), ms))]);
const loadScript = (src) => new Promise((res, rej) => {
  const s = el("script", { src });
  s.onload = res; s.onerror = () => rej(new Error("Could not load " + src));
  document.head.append(s);
});

/* ===================== proxy-aware fetch ===================== */
const getProxy = () => (store.get("proxyUrl") || "/api/proxy").trim();
const proxyUrl = (url, headers = {}) => `${getProxy()}?u=${enc(url)}&h=${enc(JSON.stringify(headers))}`;
const FORBIDDEN = /^(referer|user-agent|origin|cookie|host|accept-encoding|sec-.*)$/i;

const PLOG = [];
const plog = (t) => { PLOG.push(String(t).slice(0, 220)); if (PLOG.length > 60) PLOG.shift(); };
const hostOf = (u) => { try { return new URL(u).host + new URL(u).pathname.slice(0, 40); } catch { return String(u).slice(0, 60); } };
const provConsole = Object.fromEntries(["log", "info", "warn", "error", "debug"].map((k) => [k, (...a) => { plog(`console.${k}: ` + a.map((x) => { try { return typeof x === "string" ? x : x instanceof Error ? x.message : JSON.stringify(x); } catch { return String(x); } }).join(" ")); }]));

// Direct first (cheap); falls back to the proxy when CORS blocks it or forbidden headers are needed.
async function pfetch(input, init = {}) {
  const t0 = typeof input === "string" ? input : input.url;
  try {
    const r = await pfetchInner(input, init);
    let why = "";
    if (r.status >= 400) { try { why = " " + (await r.clone().text()).replace(/\s+/g, " ").slice(0, 120); } catch { /* ignore */ } }
    plog(`${(init.method || "GET").toUpperCase()} ${hostOf(t0)} -> ${r.status}${why}`); return r;
  }
  catch (e) { plog(`${(init.method || "GET").toUpperCase()} ${hostOf(t0)} FAILED: ${e.message}`); throw e; }
}
async function pfetchInner(input, init = {}) {
  const url = typeof input === "string" ? input : input.url;
  const headers = init.headers instanceof Headers ? Object.fromEntries(init.headers) : { ...(init.headers || {}) };
  const method = (init.method || "GET").toUpperCase();
  const viaProxy = () => fetch(proxyUrl(url, headers), {
    method, body: init.body, signal: init.signal,
    headers: headers["Content-Type"] || headers["content-type"] ? { "Content-Type": headers["Content-Type"] || headers["content-type"] } : undefined,
  });
  if (Object.keys(headers).some((k) => FORBIDDEN.test(k))) return viaProxy();
  try {
    return await fetch(url, { ...init, method, headers });
  } catch (e) {
    if (e.name === "AbortError") throw e;
    return viaProxy(); // CORS / mixed content -> proxy
  }
}

/* ===================== zip reader (browser, no library) ===================== */
async function readZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 22 - 65535); i--)
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Not a valid zip file");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  if (count === 0xffff || p === 0xffffffff) throw new Error("Zip64 archives are not supported");
  const dec = new TextDecoder();
  const files = new Map();
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("Corrupt zip directory");
    const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true), usize = dv.getUint32(p + 24, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl)).replace(/\\/g, "/").replace(/^\.\//, "");
    p += 46 + nl + xl + cl;
    if (name.endsWith("/") || flags & 1) continue;
    if (!/\.(js|cjs|mjs|json)$/i.test(name) || /(^|\/)(node_modules|__MACOSX)\//.test(name) || /\.min\.js$/i.test(name) && usize > 2 * 1024 * 1024) continue;
    if (name.split("/").includes("..") || name.startsWith("/")) continue; // unsafe path
    if (usize > 5 * 1024 * 1024) continue;
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const raw = u8.subarray(start, start + csize);
    let data;
    if (method === 0) data = raw;
    else if (method === 8) {
      const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      data = new Uint8Array(await new Response(stream).arrayBuffer());
    } else continue;
    files.set(name, dec.decode(data));
  }
  return files;
}

// Find provider folders inside the unzipped files. Accepts: index/main/provider.js, Vega split files
// (posts/catalog/search + stream), or any folder whose js files export getStream/getPosts.
const ENTRY_NAMES = ["index.js", "main.js", "provider.js", "module.js", "app.js"];
function findProviders(files) {
  const has = (d, f) => files.has(d ? `${d}/${f}` : f);
  const dirs = new Set([...files.keys()].filter((k) => /\.(c|m)?js$/i.test(k)).map((k) => (k.includes("/") ? k.slice(0, k.lastIndexOf("/")) : "")));
  const sniff = (d) => [...files].some(([k, v]) => /\.(c|m)?js$/i.test(k) && dirname(k) === d && /getStream|getPosts|getSearchPosts|getStreams/.test(v));
  const looks = (d) => ENTRY_NAMES.some((n) => has(d, n)) || (has(d, "stream.js") && (has(d, "posts.js") || has(d, "catalog.js") || has(d, "search.js"))) || sniff(d);
  const jsRe = /\.(c|m)?js$/i;
  const bundles = [...files].filter(([k, v]) => jsRe.test(k) && /(^|\/)providers\/[^/]+$/.test(k) && /getStreams/.test(v) && !/\.min\./.test(k));
  if (bundles.length) return bundles.map(([k, v]) => { const n = k.split("/").pop(); return { dir: k.slice(0, k.lastIndexOf("/")), entry: n, files: { [n]: v } }; });
  // several single-file providers sitting in one folder -> one provider per file
  const split = (d, f) => {
    const direct = [...f].filter(([k, v]) => jsRe.test(k.slice(d ? d.length + 1 : 0)) && !k.slice(d ? d.length + 1 : 0).includes("/") && /getStreams/.test(v));
    const named = ENTRY_NAMES.some((n) => f.has(n)) || (f.has("stream.js") && f.has("posts.js"));
    return direct.length >= 2 && !named ? direct.map(([k, v]) => { const n = k.split("/").pop(); return { dir: d, entry: n, files: { [n]: v } }; }) : null;
  };
  if (looks("")) { const sp = split("", files); return sp || [{ dir: "", files: Object.fromEntries(files) }]; }
  const kept = [];
  for (const d of [...dirs].filter(looks).sort((a, b) => a.split("/").length - b.split("/").length))
    if (!kept.some((k) => d.startsWith(k + "/"))) kept.push(d);
  return kept.flatMap((d) => {
    const sub = new Map([...files].filter(([k]) => k.startsWith(d + "/")).map(([k, v]) => [k.slice(d.length + 1), v]));
    return split(d, new Map([...files].filter(([k]) => k.startsWith(d + "/")).map(([k, v]) => [k, v]))) || [{ dir: d, files: Object.fromEntries(sub) }];
  });
}

/* ===================== provider runtime ===================== */
const ESM_RE = /^\s*(import\s[^(]*?from\s|import\s*["'{*]|export\s+(default|const|let|var|function|async|class|\{|\*))/m;

function esmToCjs(src) {
  const names = [], extra = [];
  src = src
    .replace(/^\s*import\s+\*\s+as\s+(\w+)\s+from\s+["']([^"']+)["'];?/gm, 'const $1 = require("$2");')
    .replace(/^\s*import\s+\{([^}]*)\}\s+from\s+["']([^"']+)["'];?/gm, (_m, a, b) => `const {${a.replace(/\s+as\s+/g, ": ")}} = require("${b}");`)
    .replace(/^\s*import\s+(\w+)\s+from\s+["']([^"']+)["'];?/gm, 'const $1 = (m => (m && m.default !== undefined ? m.default : m))(require("$2"));')
    .replace(/^\s*import\s+["']([^"']+)["'];?/gm, 'require("$1");')
    .replace(/^(\s*)export\s+default\s+/gm, "$1exports.default = ")
    .replace(/^(\s*)export\s+(const|let|var)\s+(\w+)/gm, (_m, s, k, n) => { names.push(n); return `${s}${k} ${n}`; })
    .replace(/^(\s*)export\s+((?:async\s+)?function\*?\s+(\w+))/gm, (_m, s, d, n) => { names.push(n); return `${s}${d}`; })
    .replace(/^(\s*)export\s+(class\s+(\w+))/gm, (_m, s, d, n) => { names.push(n); return `${s}${d}`; })
    .replace(/^\s*export\s*\{([^}]*)\};?/gm, (_m, list) => {
      list.split(",").map((x) => x.trim()).filter(Boolean).forEach((x) => { const [a, b] = x.split(/\s+as\s+/); extra.push(`exports.${b || a} = ${a};`); });
      return "";
    });
  return `${src}\n${names.map((n) => `exports.${n} = ${n};`).join("\n")}\n${extra.join("\n")}`;
}

// axios replacement built on pfetch
function makeAxios(defaults = {}) {
  async function request(cfg) {
    cfg = { ...defaults, ...cfg, headers: { ...defaults.headers, ...cfg.headers } };
    let url = cfg.url || "";
    if (cfg.baseURL && !/^https?:/i.test(url)) url = cfg.baseURL.replace(/\/$/, "") + "/" + url.replace(/^\//, "");
    if (cfg.params) {
      const sp = new URLSearchParams();
      for (const [k, v] of Object.entries(cfg.params)) if (v != null) sp.append(k, v);
      url += (url.includes("?") ? "&" : "?") + sp;
    }
    const headers = { ...cfg.headers };
    const method = (cfg.method || "get").toUpperCase();
    let body = cfg.data;
    if (body && typeof body === "object" && !(body instanceof URLSearchParams) && !(body instanceof FormData) &&
        !(body instanceof Blob) && !(body instanceof ArrayBuffer)) {
      body = JSON.stringify(body);
      if (!Object.keys(headers).some((k) => k.toLowerCase() === "content-type")) headers["Content-Type"] = "application/json";
    } else if (body instanceof URLSearchParams) {
      body = body.toString();
      if (!Object.keys(headers).some((k) => k.toLowerCase() === "content-type")) headers["Content-Type"] = "application/x-www-form-urlencoded";
    }
    const res = await pfetch(url, { method, headers, body: method === "GET" || method === "HEAD" ? undefined : body, signal: cfg.signal });
    const rt = cfg.responseType;
    let data;
    if (rt === "arraybuffer") data = await res.arrayBuffer();
    else if (rt === "blob") data = await res.blob();
    else {
      data = await res.text();
      if (!rt || rt === "json") { try { data = JSON.parse(data); } catch { /* keep text */ } }
    }
    const out = { data, status: res.status, statusText: res.statusText, headers: Object.fromEntries(res.headers.entries()), config: cfg, request: { responseURL: res.headers.get("x-final-url") || res.url } };
    if (!(cfg.validateStatus || ((s) => s >= 200 && s < 300))(res.status)) {
      const err = new Error(`Request failed with status code ${res.status}`);
      Object.assign(err, { response: out, isAxiosError: true, config: cfg });
      throw err;
    }
    return out;
  }
  const inst = (a, b) => (typeof a === "string" ? request({ ...b, url: a }) : request(a));
  inst.request = request;
  for (const m of ["get", "delete", "head", "options"]) inst[m] = (u, c) => request({ ...c, url: u, method: m });
  for (const m of ["post", "put", "patch"]) inst[m] = (u, d, c) => request({ ...c, url: u, data: d, method: m });
  inst.create = (c) => makeAxios({ ...defaults, ...c });
  inst.defaults = { headers: {} };
  inst.isAxiosError = (e) => !!e?.isAxiosError;
  inst.interceptors = { request: { use() {} }, response: { use() {} } };
  return inst;
}

// cheerio replacement: jQuery running on a DOMParser document (same chaining API for common use)
let jqPromise;
const ensureJQuery = () => (jqPromise ||= loadScript("https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js")
  .then(() => { const j = window.jQuery.noConflict(true); return j; })
  .catch((e) => { jqPromise = null; throw e; }));

function makeCheerio(jq) {
  return {
    load(html) {
      const doc = new DOMParser().parseFromString(String(html), "text/html");

    getCatalog: () => first.getCatalog(), getPosts: (a) => first.getPosts(a), getSearchPosts: (a) => first.getSearchPosts(a),
    getMeta: (a) => first.getMeta(a), getEpisodes: (a) => first.getEpisodes(a),
    getStream: (a) => new Promise((resolve) => {

async function initProviders() {
  let recs = [];
  try {
    recs = await idb.all();
    if (!store.get("seeded")) {
      const demo = { id: "archive-demo", folder: "archive-demo", files: { "index.js": $("#demo-provider").textContent }, baseUrl: "" };
      if (!recs.some((r) => r.id === demo.id)) { await idb.put(demo); recs.push(demo); }
      store.set("seeded", "1");
    }
  } catch (e) {
    console.warn("IndexedDB unavailable, using in-memory providers", e);
    recs = [{ id: "archive-demo", folder: "archive-demo", files: { "index.js": $("#demo-provider").textContent }, baseUrl: "" }];
  }
  S.providers = []; S.failed = [];
  for (const r of recs) {
    try { S.providers.push(await loadProvider(r)); }
    catch (e) { S.failed.push({ id: r.id, error: e.message }); console.warn(`[skip] ${r.id}:`, e); }

/* ===================== player ===================== */
let hlsLoader;
const loadHls = () => (hlsLoader ||= loadScript("https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js")
  .then(() => window.Hls).catch((e) => { hlsLoader = null; throw e; }));

function mountPlayer(box, s, poster, onError, extra) {
  if (s.type === "embed" || s.type === "iframe" || s.type === "page") {
    const f = el("iframe", { src: s.link, allowfullscreen: true, allow: "autoplay; fullscreen; picture-in-picture", referrerpolicy: "no-referrer", style: "width:100%;aspect-ratio:16/9;border:0;background:#000" });
    box.replaceChildren(f);
    return () => { f.src = "about:blank"; };
  }
  const v = el("video", { controls: true, autoplay: true, playsinline: true });
  if (poster) v.poster = poster;
  for (const [k, t] of (s.subtitles || []).entries()) {
    const u = t.uri || t.url || t.file || t.link; if (!u) continue;
    v.append(el("track", { kind: "subtitles", src: proxyUrl(u, {}), label: t.title || t.lang || t.language || `Sub ${k + 1}`, srclang: (t.language || t.lang || "en").slice(0, 2), default: k === 0 }));
  }
  box.replaceChildren(v);
  const merged = { ...(extra || {}), ...(s.headers || {}) };
  const hdrs = Object.keys(merged).length ? merged : null;
  let isHls = s.type === "m3u8" || /\.m3u8(\?|$)/i.test(s.link), triedHls = false;
  const orig = (() => { try { return new URL(s.link).origin + "/"; } catch { return ""; } })();
  // attempts: provider headers via proxy, then direct (no Referer); or direct, plain proxy, proxy with the CDN's own origin as Referer
  const urls = hdrs ? [proxyUrl(s.link, hdrs), s.link] : [s.link, proxyUrl(s.link, {}), proxyUrl(s.link, { Referer: orig })];
  const host = (() => { try { return new URL(s.link).host; } catch { return s.link; } })();
  const log = [];
  let attempt = 0, hls = null, dead = false;

  // last resort: ask the proxy what the server really answers, so the error says why
  const finish = async (msg) => {
    const probes = [];
    for (const h of hdrs ? [hdrs] : [{}, { Referer: orig }]) {
      try {
        const r = await fetch(proxyUrl(s.link, h), { headers: { Range: "bytes=0-199" } });
        const ct = (r.headers.get("content-type") || "").split(";")[0];
        const txt = /text|json|mpegurl|xml/i.test(ct) ? (await r.text()).slice(0, 100).replace(/\s+/g, " ") : "(binary)";
        probes.push(`proxy ${JSON.stringify(h).slice(0, 120)} -> HTTP ${r.status} ${ct} ${txt}`);
      } catch (e) { probes.push("proxy request failed: " + e.message); }
    }
    if (!dead) onError(msg, [`type=${s.type || "?"} host=${host}`, `link=${String(s.link).slice(0, 140)}`, ...log, ...probes].join("\n"));
  };
  const fail = (msg) => {
    if (attempt < urls.length - 1) { attempt++; start(); }
    else if (!s.type && !isHls && !triedHls) { triedHls = true; isHls = true; attempt = 0; log.push("retrying as HLS"); start(); }
    else finish(msg);
  };
  const native = (src) => {
    v.onerror = () => { log.push(`video error code ${v.error?.code} ${v.error?.message || ""} (${urls[attempt] === s.link ? "direct" : "via proxy"})`); fail("This video could not be played."); };
    v.src = src;
  };

  function start() {
    if (dead) return;
    const src = urls[attempt];
    hls?.destroy(); hls = null;
    if (!isHls) return native(src);
    const canNative = !!v.canPlayType("application/vnd.apple.mpegurl");
    loadHls().then((H) => {
      if (dead) return;
      if (H?.isSupported()) {
        hls = new H();
        hls.loadSource(src);
        hls.attachMedia(v);
        hls.on(H.Events.ERROR, (_e, d) => {
          if (!d.fatal) return;
          log.push(`hls ${d.type}/${d.details} http=${d.response?.code ?? "-"} (try ${attempt + 1})`);
          fail("Stream failed to load.");
        });
      } else if (canNative) native(src);
      else onError("This browser cannot play HLS streams.");
    }).catch((e) => { log.push("hls.js: " + e.message); if (canNative) native(src); else onError(e.message); });
  }
  start();
  return () => { dead = true; hls?.destroy(); v.onerror = null; v.pause(); v.removeAttribute("src"); v.load(); };
}

/* ===================== stream info (language / quality / server) ===================== */
const LANGS = [["Hindi", /hindi|\bhin\b/i], ["English", /english|\beng\b/i], ["Tamil", /tamil/i], ["Telugu", /telugu/i], ["Malayalam", /malayalam/i], ["Kannada", /kannada/i], ["Bengali", /bengali/i], ["Punjabi", /punjabi/i], ["Spanish", /spanish|latino/i], ["French", /french/i], ["Dual Audio", /dual/i], ["Multi Audio", /multi/i]];
const qRank = (q) => (q === "4K" ? 2160 : parseInt(q) || 0);
function streamInfo(x) {
  const t = [x.server, x.title, x.name, x.quality, x.language, x.lang].filter(Boolean).join(" ");
  const langs = LANGS.filter(([, r]) => r.test(t)).map(([n]) => n);
  const m = t.match(/(2160|1440|1080|720|576|480|360|240)\s*p?/i);
  return { langs: langs.length ? langs : ["Original"], q: /4k|uhd/i.test(t) || (m && m[1] === "2160") ? "4K" : m ? m[1] + "p" : "SD", srv: x.provider || x.server || "Server" };
}

function openDetail(post) {
  const p = cur();
  const host = $("#detail");
  let f = { lang: "All", q: "All", srv: "All" }, meta = null, streams = null, err = "", errDetail = "", idx = 0, eps = null, sel = null, idle = false, stopPlayer = null, gone = false;

  const close = () => { gone = true; stopPlayer?.(); host.replaceChildren(); window.removeEventListener("keydown", esc); };
  const esc = (e) => e.key === "Escape" && close();
  window.addEventListener("keydown", esc);

  const videoBox = el("div");
  const body = el("div");
  const article = el("article", { class: "detail", onclick: (e) => e.stopPropagation() },
    el("button", { class: "close", onclick: close, "aria-label": "Close" }, "Close"), videoBox, body);
  host.replaceChildren(el("div", { class: "overlay", onclick: close }, article));

  const play = (link, type) => {
    streams = null; err = ""; errDetail = ""; idx = 0; idle = false; PLOG.length = 0; draw();
    videoBox.scrollIntoView({ block: "nearest", behavior: "smooth" });
    withTimeout(p.getStream({ link, type }), 60000).then((s) => {
      if (gone) return;
      streams = (Array.isArray(s) ? s.filter((x) => x && x.link) : []).map((x) => ({ ...x, _i: streamInfo(x) })).sort((a, b) => qRank(b._i.q) - qRank(a._i.q));
      f = { lang: "All", q: "All", srv: "All" };
      if (!streams.length) { err = "No playable stream found."; errDetail = `provider: ${p.name}\nlink: ${link}\nraw result: ${JSON.stringify(s)?.slice(0, 200)}\n` + (PLOG.join("\n") || "(provider made no network requests)"); }
      draw();
    }).catch((e) => { if (!gone) { err = e.message; errDetail = `provider: ${p.name}\n` + PLOG.join("\n"); draw(); } });
  };
  const showEpisodes = (g) => {
    err = ""; sel = g; eps = { title: g.title, list: null }; drawBody();
    withTimeout(p.getEpisodes({ link: g.episodesLink })).then((list) => {
      if (gone || sel !== g) return;
      eps = { title: g.title, list: list || [] }; drawBody();
    }).catch((e) => { if (gone) return; eps = null; err = e.message; draw(); });
  };

  const vis = () => (streams || []).filter((x) => (f.lang === "All" || x._i.langs.includes(f.lang)) && (f.q === "All" || x._i.q === f.q) && (f.srv === "All" || x._i.srv === f.srv));
  function draw() {
    if (gone) return;
    const s = vis()[idx];
    stopPlayer?.(); stopPlayer = null;
    if (s) stopPlayer = mountPlayer(videoBox, s, post.image, (m, d) => {
      if (idx < vis().length - 1) { idx++; err = ""; errDetail = ""; draw(); return; } // auto-try next source
      err = m + " Try another server or quality."; errDetail = d || ""; drawBody();
    }, p.rec.streamHeaders);
    else videoBox.replaceChildren(el("div", { class: "novid" }, err || (streams ? "No playable stream found." : idle ? "Choose a language, then tap an episode." : "Loading video…")));
    drawBody();
  }
  function drawBody() {
    const s = vis()[idx];
    const nodes = [];
    if (streams?.length) {
      const uniq = (k) => ["All", ...new Set(streams.flatMap((x) => (k === "langs" ? x._i.langs : [x._i[k]])))];
      const set = (k) => (v) => { f[k] = v; idx = 0; err = ""; errDetail = ""; draw(); };
      nodes.push(el("div", { class: "bar" },
        selectBox("Language", uniq("langs"), f.lang, set("lang")),
        selectBox("Quality", uniq("q").sort((a, b) => (a === "All" ? -1 : b === "All" ? 1 : qRank(b) - qRank(a))), f.q, set("q")),
        selectBox("Server", uniq("srv"), f.srv, set("srv"))));
    }
    if (s && err) nodes.push(el("p", { class: "note err" }, err));
    if (errDetail) nodes.push(el("pre", { class: "diag" }, errDetail));
    if (vis().length > 1)
      nodes.push(el("div", { class: "alts" }, vis().map((x, n) =>
        el("button", { class: n === idx ? "on" : "", onclick: () => { err = ""; errDetail = ""; idx = n; draw(); } }, `${x._i.srv} · ${x._i.q}`))));
    if (meta?.linkList?.length) {
      if (eps) nodes.push(el("div", { class: "alts" }, el("b", {}, eps.title || "Episodes"),
        eps.list === null && el("span", { class: "note" }, "Loading episodes…"),
        eps.list && eps.list.length === 0 && el("span", { class: "note" }, "No episodes found."),
        (eps.list || []).map((e, k) => el("button", { onclick: () => play(e.link, "series") }, e.title || `Episode ${k + 1}`))));
      for (const g of meta.linkList) {
        nodes.push(el("div", { class: "alts" },
          el("b", {}, g.title || g.quality || "Links"),
          (g.directLinks || []).map((d, k) => el("button", { onclick: () => play(d.link, d.type || meta.type) }, d.title || `Play ${k + 1}`)),
          g.episodesLink && el("button", { class: sel === g ? "on" : "", onclick: () => showEpisodes(g) }, "Episodes")));
      }
    }
    nodes.push(el("h3", {}, meta?.title || post.title, meta?.year && el("small", {}, ` ${meta.year}`)));
    nodes.push(el("p", {}, meta?.synopsis || (meta ? "No synopsis available." : "")));
    body.replaceChildren(...nodes);
  }

  draw();
  withTimeout(p.getMeta({ link: post.link })).then((m) => {
    if (gone) return;
    meta = m || {};
    if (meta.linkList?.length) {
      const g = meta.linkList.find((x) => x.directLinks?.length);
      if (g) play(g.directLinks[0].link, g.directLinks[0].type || meta.type);
      else {
        // series: nothing to play yet -> prompt and open the first language's episodes
        idle = true; draw();
        const first = meta.linkList.find((x) => x.episodesLink);
        if (first) showEpisodes(first);
      }
    } else play(post.link);
  }).catch((e) => { if (gone) return; meta = {}; err = e.message; play(post.link); });
}

function openManager() {
  const host = $("#modal");
  const close = () => { host.replaceChildren(); window.removeEventListener("keydown", esc); };
  const esc = (e) => e.key === "Escape" && close();
  window.addEventListener("keydown", esc);
  let file = null, busy = false, msg = null;

  const draw = () => {
    const list = S.providers.length
      ? el("ul", { class: "plist" }, S.providers.map((p) => el("li", {},
          el("div", { class: "row" }, el("span", {}, p.name),
            el("button", { disabled: busy, onclick: () => removeProvider(p) }, "Remove")),
          el("input", { type: "url", placeholder: "Base URL (optional, for providers that need it)", value: p.rec.baseUrl || "",
            onchange: async (e) => { p.rec.baseUrl = e.target.value.trim(); try { await idb.put(p.rec); } catch { /* memory only */ } } }),
          el("input", { type: "text", placeholder: 'Stream headers JSON (optional) e.g. {"Referer":"https://site.com/"}',
            value: p.rec.streamHeaders ? JSON.stringify(p.rec.streamHeaders) : "",
            onchange: async (e) => {
              try { p.rec.streamHeaders = e.target.value.trim() ? JSON.parse(e.target.value) : undefined; e.target.style.outline = ""; }
              catch { e.target.style.outline = "2px solid #ff9b8a"; return; }
              try { await idb.put(p.rec); } catch { /* memory only */ }
            } }))))
      : el("p", { class: "note" }, "No providers installed.");
    const failed = S.failed.map((f) => el("p", { class: "note err" }, `${f.id}: ${f.error}`));
    const fileIn = el("input", { type: "file", accept: ".zip,.js,.cjs,.mjs,application/zip,text/javascript", onchange: (e) => { file = e.target.files[0] || null; draw(); } });
    const proxyIn = el("input", { type: "text", value: store.get("proxyUrl"), placeholder: "/api/proxy (default, same site)",
      onchange: (e) => store.set("proxyUrl", e.target.value.trim()) });
    const sec = el("section", { class: "detail manage", onclick: (e) => e.stopPropagation() },
      el("button", { class: "close", onclick: close, "aria-label": "Close" }, "Close"),
      el("h2", {}, "Providers"), list, failed,
      el("h3", {}, "Upload provider zip"),
      el("p", { class: "note" }, "Native (index.js / main.js), Nuvio-style (getStreams), Vega-style (posts.js, meta.js, stream.js…) and single .js providers. A zip with many providers installs them all. Provider code runs in your browser, so only upload zips you trust."),
      fileIn,
      el("button", { class: "primary", disabled: busy || !file, onclick: upload }, busy ? "Working…" : "Upload & install"),
      el("h3", {}, "Proxy URL"),
      el("p", { class: "note" }, "Used for sites that block browsers (CORS) and for streams that need headers. Leave empty to use this site's /api/proxy."),
      proxyIn,
      msg && el("p", { class: msg.ok ? "note ok" : "note err", role: "status" }, msg.text));
    host.replaceChildren(el("div", { class: "overlay", onclick: close }, sec));
  };

  async function upload() {
    busy = true; msg = null; draw();
    try {
      let files;
      if (/\.(c|m)?js$/i.test(file.name)) files = new Map([["index.js", await file.text()]]);
      else {
        files = await readZip(await file.arrayBuffer());
        if (!files.size) throw new Error("Zip has no .js files");
      }
      const found = findProviders(files);
      if (!found.length) throw new Error("No provider found (need index.js/main.js, posts.js + stream.js, or any js exporting getPosts + getStream, or Nuvio-style getStreams)");
      const base = file.name.replace(/\.zip$/i, "");
      const added = [], failed = [];
      for (const f of found) {
        const folder = f.entry ? f.entry.replace(/\.(c|m)?js$/i, "") : f.dir ? f.dir.split("/").pop() : base;
        try {
          const rec = { id: folder, folder, files: f.files, baseUrl: "", entry: f.entry };
          const prov = await loadProvider(rec);
          rec.id = prov.id;
          const old = S.providers.find((x) => x.id === prov.id);
          if (old) { rec.baseUrl = old.rec.baseUrl || ""; rec.streamHeaders = old.rec.streamHeaders; }
          try { await idb.put(rec); } catch { /* memory only */ }
          S.providers = S.providers.filter((x) => x.id !== prov.id).concat(prov);
          S.failed = S.failed.filter((x) => x.id !== prov.id);
          added.push(prov);
        } catch (e) { failed.push(`${folder}: ${e.message}`); }
      }
      if (!added.length) throw new Error(failed.join(" | "));
      msg = { ok: true, text: `Added ${added.map((a) => `“${a.name}”`).join(", ")}.${failed.length ? " Skipped: " + failed.join(" | ") : ""}` };
      file = null;
      await selectProvider(autoProv() ? AUTO : added[0].id);
    } catch (e) { msg = { ok: false, text: e.message }; }
    busy = false; draw();
  }

  async function removeProvider(p) {
    if (!confirm(`Remove provider “${p.name}”?`)) return;
    try { await idb.del(p.id); } catch { /* ignore */ }
    S.providers = S.providers.filter((x) => x.id !== p.id);
    msg = { ok: true, text: `Removed “${p.name}”.` };
    if (S.pid === p.id || (S.pid === AUTO && !autoProv())) await selectProvider(S.providers[0]?.id || ""); else renderShell();
    draw();
  }
  draw();
}

// Providers ship with the site: every file in /providers is loaded automatically.
async function loadRepoProviders() {

  const queue = [...names]; // fetch 8 files at a time; only .js/.json are needed, other file types are ignored
  await Promise.all(Array.from({ length: 8 }, async () => {
    for (let n; (n = queue.shift()); ) {
      try { const r = await fetch("providers/" + n.split("/").map(encodeURIComponent).join("/")); if (r.ok) files.set("providers/" + n, await r.text()); } catch { /* skip */ }
    }
  }));
  for (const f of findProviders(files)) {
    const folder = f.entry ? f.entry.replace(/\.(c|m)?js$/i, "") : f.dir.split("/").pop() || "provider";
    try { S.providers.push(await loadProvider({ id: folder, folder, files: f.files, baseUrl: "", entry: f.entry })); }
    catch (e) { console.warn(`[skip] ${folder}: ${e.message}`); }
  }
}
(async () => {
  setNote("Loading…");
  await loadRepoProviders();
  setNote("");
  S.pid = AUTO; renderShell(); await renderHome();
})();
</script>
