<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PopcornNet · provider diagnostics</title>
<style>
:root{color-scheme:dark;--bg:#141414;--fg:#e8e8e8;--mut:#9a9a9a;--ok:#46d369;--bad:#ff6b6b;--warn:#f5c542;--card:#1f1f1f}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}p{color:var(--mut);margin:4px 0 14px}
.c{background:var(--card);border-radius:8px;padding:10px 12px;margin:8px 0}.s{font-weight:600}
.ready{color:var(--ok)}.invalid,.unavailable{color:var(--bad)}.unsupported,.duplicate,.disabled{color:var(--warn)}
ul{margin:6px 0 0;padding-left:18px}code{color:var(--mut)}
</style></head><body>
<h1>Provider diagnostics</h1>
<p>Shows whether each file in <code>api/_provider-configs</code> is valid, and which features are unsupported. No URLs or secrets are shown.</p>
<div id="out">Loading…</div>
<script>
const out = document.getElementById("out");
const add = (parent, tag, text, cls) => { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; parent.append(e); return e; };
fetch("/api/provider-configs").then((r) => r.json()).then((d) => {
  out.textContent = "";
  if (d.error) return add(out, "div", d.error, "invalid");
  (d.notes || []).forEach((n) => add(out, "p", n));
  if (!(d.diagnostics || []).length) add(out, "p", "No provider definitions found.");
  for (const x of d.diagnostics || []) {
    const c = add(out, "div", "", "c");
    add(c, "span", `${x.name || x.id || x.file} `, ""); add(c, "span", x.status, "s " + x.status);
    add(c, "div", `file: ${x.file} · source: ${x.source}${x.kind ? " · kind: " + x.kind : ""}${x.capabilities ? " · movie: " + x.capabilities.movie + ", tv: " + x.capabilities.tv + ", formats: " + (x.capabilities.formats || []).join("/") : ""}`, "").style.color = "var(--mut)";
    const ul = document.createElement("ul");
    x.errors.forEach((e) => add(ul, "li", (e.path ? e.path + ": " : "") + e.message));
    x.unsupported.forEach((u) => add(ul, "li", "unsupported: " + u));
    x.warnings.forEach((w) => add(ul, "li", "warning: " + w));
    if (ul.children.length) c.append(ul);
  }
}).catch((e) => { out.textContent = "Could not reach /api/provider-configs: " + e.message; });
</script></body></html>
